[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mijia-lamp-automation"
version = "3.1.3"
description = "Windows-native local automation for Xiaomi/Mijia miIO lamps"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "GPL-3.0-only"}
authors = [{name = "MijiaLamp contributors"}]
keywords = ["xiaomi", "mijia", "miio", "windows-11", "automation", "yeelight"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
mijialamp = "mijialamp.cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "ruff==0.16.9",
  "tzdata==2026.4",
]

[tool.setuptools.packages.find]
include = ["mijialamp*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["service.py", "agent.py"]

[tool.coverage.run]
branch = true
source = ["mijialamp"]
omit = [
  "mijialamp/cli.py",
  "mijialamp/ipc.py",
  "mijialamp/logging_setup.py",
  "mijialamp/miio_client.py",
  "mijialamp/secrets_store.py",
  "mijialamp/windows_power.py",
]

[tool.coverage.report]
show_missing = true
# Core-logic gate. Win32/miIO adapters are covered by Windows smoke tests and hardware tests.
# Raise this threshold as the mocked integration suite grows.
fail_under = 85
