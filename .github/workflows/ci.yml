name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  unit-tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install timezone data used by tests
        run: python -m pip install "tzdata==2026.4"

      - name: Compile Python
        run: python -m compileall -q mijialamp tools agent.py portable.py service.py lampctl.py sleepnow.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Repository hygiene
        run: python scripts/check_repository.py

  quality:
    name: Python quality and core coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality tools
        run: python -m pip install "coverage[toml]>=7.10,<8" "mypy==1.20.2" "ruff==0.16.9" "tzdata==2026.4"

      - name: Ruff correctness gate
        run: ruff check --select E9,F63,F7,F82 .

      - name: Ruff full lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy mijialamp

      - name: Core coverage gate
        run: |
          coverage erase
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report -m

  powershell:
    name: PowerShell quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/check-powershell.ps1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer errors
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) { exit 1 }

  runtime-dependencies:
    name: Windows runtime smoke test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.windows.lock.txt
            requirements.miio.lock.txt

      - name: Verify pins
        run: python scripts/verify_dependency_pins.py

      - name: Install pinned runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.lock.txt
          python -m pip install -r requirements.windows.lock.txt
          python -m pip install --no-deps -r requirements.miio.lock.txt
          python -m pip install --no-deps -e .

      - name: Import smoke test
        run: |
          python -c "from miio import Device; import win32serviceutil, pystray, PIL; import service, agent; from mijialamp.controller import LampController; print('runtime imports: OK')"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit pinned dependency set
        run: |
          python -m pip_audit -r requirements.lock.txt --no-deps --disable-pip --progress-spinner=off
          python -m pip_audit -r requirements.windows.lock.txt --no-deps --disable-pip --progress-spinner=off
          python -m pip_audit -r requirements.miio.lock.txt --no-deps --disable-pip --progress-spinner=off
