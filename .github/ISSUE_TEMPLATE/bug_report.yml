name: Bug report
description: Report a reproducible MijiaLamp issue / Reportá un problema reproducible de MijiaLamp
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, `mi-tokens.json`, `secrets/token.dpapi.json`, or unreviewed logs.
        No pegues tokens, `mi-tokens.json`, `secrets/token.dpapi.json` ni logs sin revisar.

  - type: input
    id: version
    attributes:
      label: MijiaLamp version / Versión de MijiaLamp
      placeholder: "3.1.3"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version / Versión de Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version / Versión de Python
      placeholder: "3.12.x"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Lamp miIO model / Modelo miIO de la lámpara
      placeholder: "yeelink.light.lamp22"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Observed behavior / Comportamiento observado
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / Logs redactados
      description: Manually check that no secrets or private information are included. / Revisá que no haya secretos ni datos privados.
      render: text
