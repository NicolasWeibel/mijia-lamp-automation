name: Feature request
description: Suggest an improvement or behavior / Proponé una mejora o comportamiento nuevo
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need / Problema o necesidad
      description: What use case would you like to solve? / ¿Qué caso de uso querés resolver?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Propuesta
      description: Describe the desired behavior. / Explicá el comportamiento deseado.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas

  - type: dropdown
    id: area
    attributes:
      label: Area / Área
      options:
        - Windows power/display events
        - miIO / device communication
        - Scheduling / policy
        - Installer / Task Scheduler
        - Security / secrets
        - Documentation / tooling
        - Other / Otro
    validations:
      required: true
